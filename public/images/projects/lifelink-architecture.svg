<rect width="1200" height="540" rx="18" fill="#111114"/><text x="48" y="56" fill="#ff7518" font-size="12" font-weight="700" letter-spacing="2.2">LIFELINK · SYSTEM ARCHITECTURE</text><rect x="48" y="110" width="300" height="110" rx="14" fill="#1b1b20" stroke="#ff7518" stroke-width="2"/><text x="198.0" y="159.0" text-anchor="middle" fill="#f2f2f4" font-size="19" font-weight="700">Mobile app</text><text x="198.0" y="183.0" text-anchor="middle" fill="#9a9aa3" font-size="13.5">Expo · React Native · TypeScript</text><text x="198" y="246" text-anchor="middle" fill="#9a9aa3" font-size="12.5">iOS · Android · installable web app</text><rect x="450" y="110" width="300" height="110" rx="14" fill="#1b1b20" stroke="#ff7518" stroke-width="2"/><text x="600.0" y="159.0" text-anchor="middle" fill="#f2f2f4" font-size="19" font-weight="700">Node.js + Express API</text><text x="600.0" y="183.0" text-anchor="middle" fill="#9a9aa3" font-size="13.5">REST · JWT · zod · Render</text><rect x="852" y="110" width="300" height="110" rx="14" fill="#1b1b20" stroke="#ff7518" stroke-width="2"/><text x="1002.0" y="159.0" text-anchor="middle" fill="#f2f2f4" font-size="19" font-weight="700">MongoDB Atlas</text><text x="1002.0" y="183.0" text-anchor="middle" fill="#9a9aa3" font-size="13.5">Mongoose · transactions · geo index</text><line x1="348" y1="165" x2="450" y2="165" stroke="#ff7518" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/><rect x="371.5" y="141.0" width="55.0" height="22" rx="11" fill="#111114"/><text x="399.0" y="157.0" text-anchor="middle" fill="#9a9aa3" font-size="12.5">HTTPS</text><line x1="750" y1="165" x2="852" y2="165" stroke="#ff7518" stroke-width="2" marker-end="url(#a)"/><text x="450" y="312" fill="#ff7518" font-size="12" font-weight="700" letter-spacing="2.2">INSIDE THE API</text><rect x="450" y="330" width="300" height="84" rx="14" fill="#1b1b20" stroke="#3a3a42" stroke-width="1.5"/><text x="600.0" y="366.0" text-anchor="middle" fill="#f2f2f4" font-size="19" font-