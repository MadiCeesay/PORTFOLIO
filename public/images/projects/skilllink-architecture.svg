udinary</text><text x="925" y="464" text-anchor="middle" fill="#9a9aa3" font-size="12">photos &amp; audio</text><rect x="1006" y="408" width="146" height="76" rx="12" fill="#1b1b20" stroke="#3a3a42"/><text x="1079" y="442" text-anchor="middle" fill="#f2f2f4" font-size="15" font-weight="700">Modem Pay</text><text x="1079" y="464" text-anchor="middle" fill="#9a9aa3" font-size="12">mobile money (test)</text><rect x="852" y="498" width="146" height="76" rx="12" fill="#1b1b20" stroke="#3a3a42"/><text x="925" y="532" text-anchor="middle" fill="#f2f2f4" font-size="15" font-weight="700">SMS.to</text><text x="925" y="554" text-anchor="middle" fill="#9a9aa3" font-size="12">SMS alerts</text><rect x="1006" y="498" width="146" height="76" rx="12" fill="#1b1b20" stroke="#3a3a42"/><text x="1079" y="532" text-anchor="middle" fill="#f2f2f4" font-size="15" font-weight="700">OpenStreetMap</text><text x="1079" y="554" text-anchor="middle" fill="#9a9aa3" font-size="12">maps &amp; pins</text><line x1="750" y1="406" x2="852" y2="406" stroke="#ff7518" stroke-width="2" marker-end="url(#a)"/><text x="48" y="300" fill="#ff7518" font-size="12" font-weight="700" letter-spacing="2.2">ROLES</text><rect x="48" y="318" width="300" height="76" rx="12" fill="#1b1b20" stroke="#3a3a42"/><text x="66" y="351" fill="#f2f2f4" font-size="16" font-weight="700">Customer</text><text x="66" y="374" fill="#9a9aa3" font-size="13">post jobs · book · pay · review</text><rect x="48" y="408" width="300" height="76" rx="12" fill="#1b1b20" stroke="#3a3a42"/><text x="66" y="441" fill="#f2f2f4" font-size="16" font-weight="700">Worker</text><text x="66" y="464" fill="#9a9aa3" font-size="13">offers · availability · chat</text><rect x="48" y="498" width="300" height="76" rx="12" fill="#1b1b20" stroke="#3a3a42"/><text x="66" y="531" fill="#f2f2f4" font-size="16" font-weight="700">Admin</text><text x="66" y="554" fill="#9a9aa3" font-size="13">verification · disputes · audit</text></svg>